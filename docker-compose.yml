services:
  knowmap:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: knowmap-ai

    ports:
      - "5000:5000"

    environment:
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DATABASE_PATH=/app/data/users.db
      - FLASK_DEBUG=false

    volumes:
      - knowmap_data:/app/data

    restart: unless-stopped

volumes:
  knowmap_data:
    driver: local